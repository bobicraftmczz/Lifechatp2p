<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P v42 - Estabilidad</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0b141a; --header: #202c33; --accent: #00a884; --text: #e9edef; --msg-me: #005c4b; --msg-friend: #202c33; --border: #222d34; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; position: fixed; width: 100vw; }

        /* Modal de Llamada */
        #incoming-modal { display: none; position: fixed; inset: 0; background: rgba(11,20,26,0.98); z-index: 99999; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Contenedor Principal */
        #app-container { display: flex; width: 200vw; height: 100vh; transition: transform 0.3s ease-in-out; }
        .view { width: 100vw; height: 100vh; display: flex; flex-direction: column; position: relative; }

        .top-bar { background: var(--header); padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); height: 60px; }
        
        /* Área de Mensajes */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; padding-bottom: 100px; }
        
        /* BARRA DE ESCRIBIR CORREGIDA */
        .input-bar-container { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            background: var(--bg); padding: 15px; border-top: 1px solid var(--border);
            display: flex; justify-content: center;
        }
        .input-bar { 
            width: 100%; max-width: 500px; background: var(--header); 
            padding: 5px 15px; display: flex; gap: 10px; border-radius: 30px; align-items: center;
        }
        .input-bar input { 
            flex: 1; border: none; background: transparent; color: white; 
            outline: none; font-size: 16px; height: 40px; 
        }

        #call-screen { display: none; position: fixed; inset: 0; background: black; z-index: 10000; flex-direction: column; }
        video { width: 100%; height: 50%; object-fit: cover; }
    </style>
</head>
<body>

<div id="incoming-modal">
    <div style="background:var(--header); padding:40px; border-radius:30px; text-align:center; border:2px solid var(--accent); width:85%;">
        <h1 style="font-size: 50px;">📞</h1>
        <h2 id="caller-id-display" style="margin:20px 0;">Alguien llama</h2>
        <div style="display:flex; gap:15px; justify-content:center;">
            <button onclick="location.reload()" style="background:#ff3b30; color:white; border:none; padding:15px 25px; border-radius:30px;">COLGAR</button>
            <button onclick="aceptarAhora()" style="background:var(--accent); color:white; border:none; padding:15px 25px; border-radius:30px;">ACEPTAR</button>
        </div>
    </div>
</div>

<div id="app-container">
    <!-- VISTA 1: LISTA -->
    <section class="view">
        <div class="top-bar"><b>P2P v42</b> <span id="my-id-ui"></span></div>
        <div style="padding:15px; display:flex; gap:10px; background:#111b21;">
            <input type="text" id="add-id" placeholder="ID amigo..." style="flex:1; padding:12px; border-radius:10px; background:#2a3942; border:none; color:white;">
            <button onclick="addAmigo()" style="background:var(--accent); border:none; padding:10px 20px; border-radius:10px; color:white; font-weight:bold;">+</button>
        </div>
        <div id="lista" style="flex:1; overflow-y:auto;"></div>
    </section>

    <!-- VISTA 2: CHAT -->
    <section class="view">
        <div class="top-bar">
            <button onclick="back()" style="background:none; border:none; color:var(--accent); font-size:25px;">←</button>
            <b id="chat-title">Chat</b>
            <button onclick="llamar()" style="background:none; border:none; font-size:22px;">🎥</button>
        </div>
        <div id="messages"></div>
        <div class="input-bar-container">
            <div class="input-bar">
                <!-- Evento onkeydown añadido para detectar Enter -->
                <input type="text" id="m-input" placeholder="Escribe un mensaje..." onkeydown="checkEnter(event)">
                <button onclick="enviar()" style="background:var(--accent); border:none; width:40px; height:40px; border-radius:50%; color:white; display:flex; align-items:center; justify-content:center;">➤</button>
            </div>
        </div>
    </section>
</div>

<div id="call-screen">
    <video id="v-remote" autoplay playsinline></video>
    <video id="v-local" autoplay muted playsinline></video>
    <div style="height:100px; display:flex; justify-content:center; align-items:center;">
        <button onclick="location.reload()" style="background:red; width:65px; height:65px; border-radius:50%; border:none; color:white;">✖</button>
    </div>
</div>

<script>
    let peer, conn, localStream, chatActual, callEntrante;
    let miId = localStorage.getItem('id42') || prompt("Tu nombre:").toLowerCase().trim();
    localStorage.setItem('id42', miId);

    window.onload = () => {
        document.getElementById('my-id-ui').innerText = "ID: " + miId;
        render();
        peer = new Peer(miId, { config: {'iceServers': [{ url: 'stun:stun.l.google.com:19302' }]} });
        
        peer.on('call', call => {
            callEntrante = call;
            if(navigator.vibrate) navigator.vibrate([500, 200, 500]);
            document.getElementById('caller-id-display').innerText = call.peer;
            document.getElementById('incoming-modal').style.display = 'flex';
            alert("⚠️ LLAMADA ENTRANTE DE: " + call.peer);
        });

        peer.on('connection', c => {
            c.on('data', d => { guard(c.peer, d, 'friend'); if(chatActual === c.peer) print(d, 'friend'); });
            actualizarListaAmigos(c.peer);
        });
    };

    // Función para detectar tecla Enter
    function checkEnter(event) {
        if (event.key === "Enter") {
            event.preventDefault(); // Evita que el teclado se cierre o salte de línea
            enviar();
        }
    }

    async function aceptarAhora() {
        document.getElementById('incoming-modal').style.display = 'none';
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('call-screen').style.display = 'flex';
        document.getElementById('v-local').srcObject = localStream;
        callEntrante.answer(localStream);
        callEntrante.on('stream', rs => document.getElementById('v-remote').srcObject = rs);
    }

    async function llamar() {
        localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
        document.getElementById('call-screen').style.display = 'flex';
        document.getElementById('v-local').srcObject = localStream;
        const call = peer.call(chatActual, localStream);
        call.on('stream', rs => document.getElementById('v-remote').srcObject = rs);
    }

    function enviar() {
        const i = document.getElementById('m-input');
        if(!i.value || !chatActual) return;
        guard(chatActual, i.value, 'me'); print(i.value, 'me');
        if(conn && conn.open) conn.send(i.value);
        i.value = "";
        i.focus(); // Mantiene el foco para seguir escribiendo
    }

    function guard(id, t, cl) {
        let h = JSON.parse(localStorage.getItem('h42_'+id) || '[]');
        h.push({t, cl}); localStorage.setItem('h42_'+id, JSON.stringify(h));
    }

    function print(t, cl) {
        const d = document.createElement('div');
        d.style.cssText = `padding:10px 15px; border-radius:15px; max-width:80%; margin-bottom:8px; line-height:1.4; ${cl=='me'?'align-self:flex-end; background:var(--msg-me); border-bottom-right-radius:2px;':'align-self:flex-start; background:var(--msg-friend); border-bottom-left-radius:2px;'}`;
        d.innerText = t;
        const b = document.getElementById('messages'); 
        b.appendChild(d); 
        b.scrollTop = b.scrollHeight;
    }

    function render() {
        const c = document.getElementById('lista'); c.innerHTML = "";
        let ams = JSON.parse(localStorage.getItem('am42') || '[]');
        ams.forEach(id => {
            const d = document.createElement('div');
            d.style.cssText = "padding:20px; border-bottom:1px solid #222; display:flex; align-items:center; gap:15px;";
            d.innerHTML = `<div style="width:40px; height:40px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold;">${id[0].toUpperCase()}</div> <span>${id}</span>`;
            d.onclick = () => {
                chatActual = id; document.getElementById('chat-title').innerText = id;
                document.getElementById('app-container').style.transform = 'translateX(-100vw)';
                document.getElementById('messages').innerHTML = "";
                let h = JSON.parse(localStorage.getItem('h42_'+id) || '[]');
                h.forEach(m => print(m.t, m.cl));
                if(conn) conn.close(); conn = peer.connect(id);
            };
            c.appendChild(d);
        });
    }

    function actualizarListaAmigos(nuevoId) {
        let ams = JSON.parse(localStorage.getItem('am42') || '[]');
        if(!ams.includes(nuevoId)) {
            ams.push(nuevoId);
            localStorage.setItem('am42', JSON.stringify(ams));
            render();
        }
    }

    function addAmigo() {
        let i = document.getElementById('add-id');
        if(i.value) { actualizarListaAmigos(i.value.toLowerCase().trim()); i.value=""; }
    }

    function back() { 
        document.getElementById('app-container').style.transform = 'translateX(0)'; 
        chatActual = null; 
    }
</script>
</body>
</html>
