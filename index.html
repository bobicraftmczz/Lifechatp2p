<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P v41 - Alerta Total</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0b141a; --header: #202c33; --accent: #00a884; --text: #e9edef; --msg-me: #005c4b; --msg-friend: #202c33; --border: #222d34; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; position: fixed; width: 100vw; }

        /* Pantalla de Llamada Entrante Ultra-Visible */
        #incoming-modal { 
            display: none; position: fixed; inset: 0; background: rgba(11, 20, 26, 0.98); 
            z-index: 99999; flex-direction: column; align-items: center; justify-content: center; 
        }
        .caller-box { background: var(--header); padding: 40px; border-radius: 30px; text-align: center; border: 2px solid var(--accent); width: 85%; }
        
        .top-bar { background: var(--header); padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        #messages { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 180px; display: flex; flex-direction: column; }
        
        .input-bar { position: absolute; bottom: 85px; width: 90%; left: 5%; background: var(--header); padding: 10px; display: flex; gap: 10px; border-radius: 40px; }
        .input-bar input { flex: 1; border: none; background: transparent; color: white; outline: none; font-size: 16px; }

        #call-screen { display: none; position: fixed; inset: 0; background: black; z-index: 10000; flex-direction: column; }
        video { width: 100%; height: 50%; object-fit: cover; }
    </style>
</head>
<body>

<div id="incoming-modal">
    <div class="caller-box">
        <h1 style="font-size: 50px;">📞</h1>
        <h2 id="caller-id-display" style="margin: 20px 0;">Alguien llama</h2>
        <p style="color: var(--accent); margin-bottom: 20px;">LLAMADA ENTRANTE...</p>
        <div style="display: flex; gap: 20px; justify-content: center;">
            <button onclick="location.reload()" style="background: #ff3b30; color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold;">COLGAR</button>
            <button onclick="aceptarAhora()" style="background: var(--accent); color: white; border: none; padding: 15px 30px; border-radius: 30px; font-weight: bold;">ACEPTAR</button>
        </div>
    </div>
</div>

<div id="app-container" style="display: flex; width: 200vw; height: 100vh; transition: transform 0.3s ease;">
    <section style="width: 100vw; height: 100vh; display: flex; flex-direction: column;">
        <div class="top-bar"><b>P2P v41</b> <span id="my-id-ui"></span></div>
        <div style="padding: 15px; display: flex; gap: 10px;">
            <input type="text" id="add-id" placeholder="ID amigo..." style="flex:1; padding:12px; border-radius:10px; background:#2a3942; border:none; color:white;">
            <button onclick="addAmigo()" style="background:var(--accent); border:none; padding:10px 20px; border-radius:10px; color:white;">+</button>
        </div>
        <div id="lista" style="flex:1; overflow-y:auto;"></div>
    </section>

    <section style="width: 100vw; height: 100vh; display: flex; flex-direction: column;">
        <div class="top-bar">
            <button onclick="back()" style="background:none; border:none; color:var(--accent); font-size:25px;">←</button>
            <b id="chat-title">Chat</b>
            <button onclick="llamar()" style="background:none; border:none; font-size:22px;">🎥</button>
        </div>
        <div id="messages"></div>
        <div class="input-bar">
            <input type="text" id="m-input" placeholder="Mensaje...">
            <button onclick="enviar()" style="background:var(--accent); border:none; width:45px; height:45px; border-radius:50%; color:white;">➤</button>
        </div>
    </section>
</div>

<div id="call-screen">
    <video id="v-remote" autoplay playsinline></video>
    <video id="v-local" autoplay muted playsinline></video>
    <div style="height:100px; display:flex; justify-content:center; align-items:center;">
        <button onclick="location.reload()" style="background:red; width:65px; height:65px; border-radius:50%; border:none; color:white;">✖</button>
    </div>
</div>

<script>
    let peer, conn, localStream, chatActual, callEntrante;
    let miId = localStorage.getItem('id41') || prompt("Tu nombre:").toLowerCase().trim();
    localStorage.setItem('id41', miId);

    window.onload = () => {
        document.getElementById('my-id-ui').innerText = miId;
        render();
        peer = new Peer(miId, { config: {'iceServers': [{ url: 'stun:stun.l.google.com:19302' }]} });
        
        peer.on('call', call => {
            callEntrante = call;
            // 1. Vibración (si el móvil lo permite)
            if(navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
            
            // 2. Mostrar Modal Visual
            document.getElementById('caller-id-display').innerText = call.peer;
            document.getElementById('incoming-modal').style.display = 'flex';
            
            // 3. Alerta de Sistema (Esto detiene todo y obliga a mirar el móvil)
            setTimeout(() => {
                alert("⚠️ ¡TE ESTÁN LLAMANDO: " + call.peer + "!");
            }, 100);
        });

        peer.on('connection', c => {
            c.on('data', d => { guard(c.peer, d, 'friend'); if(chatActual === c.peer) print(d, 'friend'); });
            let ams = JSON.parse(localStorage.getItem('am41') || '[]');
            if(!ams.includes(c.peer)) { ams.push(c.peer); localStorage.setItem('am41', JSON.stringify(ams)); render(); }
        });
    };

    async function aceptarAhora() {
        document.getElementById('incoming-modal').style.display = 'none';
        try {
            localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('v-local').srcObject = localStream;
            callEntrante.answer(localStream);
            callEntrante.on('stream', rs => document.getElementById('v-remote').srcObject = rs);
        } catch(e) { alert("Error de cámara"); }
    }

    async function llamar() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
            document.getElementById('call-screen').style.display = 'flex';
            document.getElementById('v-local').srcObject = localStream;
            const call = peer.call(chatActual, localStream);
            call.on('stream', rs => document.getElementById('v-remote').srcObject = rs);
        } catch(e) { alert("Activa la cámara"); }
    }

    // Lógica de Chat y Renderizado
    function enviar() {
        const i = document.getElementById('m-input');
        if(!i.value || !chatActual) return;
        guard(chatActual, i.value, 'me'); print(i.value, 'me');
        if(conn && conn.open) conn.send(i.value);
        i.value = "";
    }
    function guard(id, t, cl) {
        let h = JSON.parse(localStorage.getItem('h41_'+id) || '[]');
        h.push({t, cl}); localStorage.setItem('h41_'+id, JSON.stringify(h));
    }
    function print(t, cl) {
        const d = document.createElement('div');
        d.style.cssText = `padding:10px; border-radius:10px; max-width:80%; margin-bottom:8px; ${cl=='me'?'align-self:flex-end; background:var(--msg-me);':'align-self:flex-start; background:var(--msg-friend);'}`;
        d.innerText = t;
        const b = document.getElementById('messages'); b.appendChild(d); b.scrollTop = b.scrollHeight;
    }
    function render() {
        const c = document.getElementById('lista'); c.innerHTML = "";
        let ams = JSON.parse(localStorage.getItem('am41') || '[]');
        ams.forEach(id => {
            const d = document.createElement('div');
            d.style.cssText = "padding:20px; border-bottom:1px solid #222;";
            d.innerText = "👤 " + id;
            d.onclick = () => {
                chatActual = id; document.getElementById('chat-title').innerText = id;
                document.querySelector('#app-container').style.transform = 'translateX(-100vw)';
                document.getElementById('messages').innerHTML = "";
                let h = JSON.parse(localStorage.getItem('h41_'+id) || '[]');
                h.forEach(m => print(m.t, m.cl));
                if(conn) conn.close(); conn = peer.connect(id);
            };
            c.appendChild(d);
        });
    }
    function addAmigo() {
        let i = document.getElementById('add-id');
        let ams = JSON.parse(localStorage.getItem('am41') || '[]');
        if(i.value) { ams.push(i.value.toLowerCase().trim()); localStorage.setItem('am41', JSON.stringify(ams)); render(); i.value=""; }
    }
    function back() { document.querySelector('#app-container').style.transform = 'translateX(0)'; chatActual = null; }
</script>
</body>
</html>
